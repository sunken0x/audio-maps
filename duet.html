<style>
:root{--bg:#05070d;--ink:#cfd6e6;--cy:#2ce1f5;--hot:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
 color:var(--ink);font:12px ui-monospace,Menlo,monospace}
/* the field is the page */
#out{position:fixed;inset:0;visibility:hidden}
/* the card is the piece now; the lab canvas underneath only feeds it */
#cardcv{position:fixed;left:50%;top:58px;transform:translateX(-50%);
 height:calc(100vh - 70px);width:auto;max-width:calc(100vw - 28px);
 box-shadow:0 10px 50px rgba(0,0,0,.6);border-radius:2px;z-index:5}
@media (max-width:760px){
 #cardcv{top:auto;bottom:10px;height:auto;width:calc(100vw - 20px);max-height:calc(100vh - 120px)}
}
.cell{position:absolute;inset:0}
.cell canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:10px 14px;
 display:flex;gap:9px;align-items:center;flex-wrap:wrap;
 background:linear-gradient(#05070de6,#05070d00);pointer-events:none}
#hud > *{pointer-events:auto}
select,button,input{background:#12203acc;color:var(--cy);border:1px solid #2ce1f555;
 padding:7px 10px;font:inherit;border-radius:3px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{background:#1b2f52}
#playbtn{background:var(--hot);color:#05070d;font-weight:700}
label{opacity:.55} #pos,#diag{opacity:.55;font-variant-numeric:tabular-nums}
#diag{font-size:10px;opacity:.3}
#title{position:fixed;left:14px;bottom:12px;z-index:10;font-size:10px;opacity:.35;
 pointer-events:none;line-height:1.5;max-width:62ch}
#title b{color:var(--cy);opacity:.9}
@media (max-width:640px){ #title{display:none} }
</style>

<div id=out></div>
<canvas id=cardcv></canvas>
<div id=hud>
 <input id=a placeholder="wallet, hash or .eth" spellcheck=false>
 <button id=rolla title="random">↻</button>
 <label>+</label>
 <input id=b placeholder="wallet, hash or .eth" spellcheck=false>
 <button id=rollb title="random">↻</button>
 <button id=go>FORGE</button>
 <label>format</label><select id=fmt>
  <option>1:1</option><option selected>4:5</option>
  <option>9:16</option><option>16:9</option></select>
 <label>matte</label><select id=matte>
  <option value=paper selected>paper</option><option value=ink>ink</option></select>
 <button id=flashbtn>flicker: on</button>
 <button id=playbtn>PLAY</button>
 <button id=stopbtn>stop</button>
 <span id=pos>&mdash;</span><span id=diag></span>
</div>
<div id=title><b>HORIZON</b> &mdash; one field. the top is one parent, the bottom the other,
blended through. Low notes throw a round hit from the centre; high notes brighten a mirrored
pair of lines either side of it and ripple from where they land.</div>

// ── TWO REACTIONS, NOT ONE ─────────────────────────────────────────────────
// LOW notes throw the round hit from the centre — the whole field answers.
// HIGH notes light up the LINES THEMSELVES: the note's pitch picks a line, and
// that line flares brighter, thicker and lifts slightly, then fades. Nothing
// else in the field moves for it.
//
// Two channels rather than one is what makes it read as a new kind of reaction:
// the bass is felt across the whole picture, the melody is drawn on it.

// --- channel 1: the round hit, from low notes ---
const ripples=[];
function lowHit(vel){
  ripples.push({t0:VT, amp:0.8+vel*2.2, speed:0.020, width:3.0, k:1.5, decay:1600, cy:0});
  if(ripples.length>10) ripples.shift();
}
const hiRipples=[];              // channel 2's own pool, never evicts channel 1
function sumRip(arr,x,y){
  let z=0;
  for(let i=arr.length-1;i>=0;i--){
    const r=arr[i], age=VT-r.t0;
    if(age>r.decay){arr.splice(i,1);continue;}
    const yy = y - (r.cy||0);      // a ripple can start off-centre now
    const env=1-age/r.decay, d=Math.sqrt(x*x+yy*yy*2.4), dr=d-r.speed*age;
    z+=r.amp*env*env*Math.cos(dr*r.k)*Math.exp(-(dr*dr)/(r.width*r.width));
  }
  return z;
}
function rip(x,y){ return sumRip(ripples,x,y) + sumRip(hiRipples,x,y); }

// --- channel 2: the lines, from high notes ---
// one slot per line. a high note excites the line its pitch maps to, plus a
// little of each neighbour so the flare has an edge rather than a hard stripe.
// Mapping pitch straight down the frame put every high note near the top, so
// the picture was lit along one edge and dead everywhere else. Pitch now sets
// DISTANCE FROM THE CENTRE LINE instead, and each note lights the pair of lines
// either side of the middle — an EQ read, mirrored about the horizon.
//
// High notes sit AT the centre and lower ones spread outward, so the busiest
// register is the middle of the composition. The reach is capped well short of
// the edges: the flare belongs in the body of the field, not on its rim.
const REACH = 0.62;                       // furthest a note may sit, as a fraction
function excite(i, a){                    //   of the half-field. keeps it centred.
  if (i < 0 || i >= NL) return;
  flare[i] = Math.min(2.2, flare[i] + a);
}
// A high note also throws its OWN small ripple, and it starts from the line the
// note lit rather than from the centre — so the melody spreads outward from
// where it is drawn while the bass still answers from the middle. Kept small,
// quick and narrow: the low hit is the event, this is the detail on top.
//
// Throttled deliberately. There are roughly twice as many high notes as low
// ones in a duet, and one ripple per note churns into noise that never resolves
// into a shape — that exact mistake was made before. One every ~140ms at most.
let lastHiRip = -999;
function highHit(midi, vel){
  const t = Math.max(0, Math.min(1, (midi - 52) / 44));      // 0 low .. 1 high
  const mid = (NL - 1) / 2;
  const d = (1 - t) * mid * REACH;                            // high -> centre
  const amp = 0.5 + vel * 1.1;
  for (const sgn of [-1, 1]){                                 // mirrored pair
    const idx = Math.round(mid + sgn * d);
    for (let k = -2; k <= 2; k++)
      excite(idx + k, amp * (k === 0 ? 1 : (Math.abs(k) === 1 ? 0.45 : 0.16)));
  }
  if (VT - lastHiRip < 40) return;
  lastHiRip = VT;
  const off = d * (typeof SPACING !== "undefined" ? SPACING : 0.345);
  for (const sgn of [-1, 1])
    hiRipples.push({t0:VT, amp:0.26+vel*0.44, speed:0.030, width:1.8, k:2.2,
                    decay:520, cy: sgn * off});
  while (hiRipples.length > 8) hiRipples.shift();
}
function decayFlare(){
  for (let i = 0; i < NL; i++) if (flare[i] > 0.001) flare[i] *= 0.90; else flare[i] = 0;
}


// ── THE REAL AUDIO MAP RENDERER ────────────────────────────────────────────
// Not an approximation of one. These are the site's own numbers and its own
// projection, lifted out of index.html:
//
//   NUM_LINES_BASE 72 · POINTS_BASE 72 · SPACING 0.345 · fov 75 · fitCamera×1.20
//
// The thing every previous attempt got wrong is WHICH WAY the field displaces.
// An audio map displaces in Z, toward the camera, and is drawn in perspective.
// A peak therefore comes at you and magnifies OUTWARD from the centre of frame,
// which is what splays the ends of the lines apart and gives a map its ragged,
// flowing silhouette. Displacing in Y instead — what I had been doing — can
// only ever bend a line up and down, so the ends stay in a column and the whole
// thing reads as a neat block cut off by a mask. Same field, wrong dimension.
const SPACING = 0.345, NLB = 72, PTSB = 72;
const FOV = 75, CAMPAD = 1.04;   // only a sliver of air; the fit is solved, not guessed
const TANH = Math.tan(FOV * Math.PI / 360);
let NL = NLB, PTS = PTSB, ASPECT = 1, HALFX = 0, HALFY = 0, CAMZ = 20;
let flare = new Float32Array(NL);

function fitField(w, h){
  ASPECT = w / h;
  NL  = ASPECT < 1 ? Math.round(NLB / ASPECT) : NLB;
  PTS = ASPECT > 1 ? Math.round(PTSB * ASPECT) : PTSB;
  if (flare.length !== NL) flare = new Float32Array(NL);
  HALFX = (PTS * SPACING) / 2;
  HALFY = (NL  * SPACING) / 2;
  // fitCamera, solved rather than padded. The site multiplies by a flat 1.20
  // and its own comment admits that is a guess for "chaos 8-9 displaces big".
  // It does not hold: in perspective a point at height z magnifies by
  // CAMZ/(CAMZ-z), so a tall field always finds the edge eventually.
  //
  // The condition for the grid corner to stay inside the frame is exact:
  //   halfY / ((CAMZ - z) * TANH) <= 1   ->   CAMZ >= halfY/TANH + z
  // so pull back by the grid's own fit PLUS the height of the terrain, and the
  // whole map is inside at any shape and any chaos. ZMAX is measured per
  // composition, so this is a fixed number and the frame never breathes.
  CAMZ = (Math.max(HALFY / TANH, HALFX / (TANH * ASPECT)) + ZMAX + RIPPLE_AIR) * CAMPAD;
}
// how tall this pair's terrain actually gets. sampled across the field over a
// spread of phases, 99.5th percentile so one rare spike cannot shrink the map.
const RIPPLE_AIR = 1.5;              // headroom for ripples and flare
let ZMAX = 2, zKey = "";
function measureZ(A, B){
  const key = A.wave+"/"+A.chaos+"/"+B.wave+"/"+B.chaos;
  if (key === zKey) return;
  zKey = key;
  const vals = [], t0 = VT, xr = 13;
  for (let ti = 0; ti < 16; ti++){
    VT = t0 + ti * 480;
    for (let li = 0; li <= 20; li++){
      const y = (li/20 - 0.5) * 13;
      for (let pi = 0; pi <= 34; pi++){
        const x = (pi/34 - 0.5) * 2 * xr;
        vals.push(Math.abs(field(A,x,y)), Math.abs(field(B,x,y)));
      }
    }
  }
  VT = t0;
  vals.sort(function(a,b){return a-b;});
  ZMAX = vals[Math.floor(vals.length * 0.995)];
}
// world -> screen, exactly as a PerspectiveCamera at (0,0,CAMZ) would
function SX(x, z, W){ return ((x / ((CAMZ - z) * TANH * ASPECT)) * 0.5 + 0.5) * W; }
function SY(y, z, H){ return (0.5 - (y / ((CAMZ - z) * TANH)) * 0.5) * H; }

// ── colour ────────────────────────────────────────────────────────────────
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function mix(a, b, t){
  const A = hx(a), B = hx(b);
  return "rgb(" + Math.round(A[0]+(B[0]-A[0])*t) + "," + Math.round(A[1]+(B[1]-A[1])*t)
       + "," + Math.round(A[2]+(B[2]-A[2])*t) + ")";
}
let FLASH = 0, FLASH_ON = 1;
function col(P, flip){ return P.pal[FLASH_ON ? (flip ? 1-FLASH : FLASH) : 0]; }

// ── the safety the perspective needs ──────────────────────────────────────
// Displacement is measured per composition and the camera is pulled back to
// cover it — but that measurement only covers the FIELD. Ripples add on top,
// and when several overlap in the same place they sum without limit. Measured
// in flight: a fit solved for a height of 6.6 was being handed points at 23.2
// against a camera at 23.8, so CAMZ-z fell to 0.6 and those points magnified
// about fortyfold. That is what threw straight lines across the frame and
// punched a hole through the middle — a point arriving at the lens.
//
// tanh saturates instead of clipping: small displacements pass through almost
// untouched, large ones ease into the ceiling rather than hitting a flat top.
// The ceiling is exactly what the fit was solved for, so the geometry can never
// outrun its own frame and the map stays inside the picture whatever plays.
function zClamp(z){
  const L = ZMAX + RIPPLE_AIR;
  return L * Math.tanh(z / L);
}

// ── one grid pass ─────────────────────────────────────────────────────────
// zf(x,y,li,pi) gives the displacement, cf(li) the colour. Every idea below is
// some combination of those two, so they all render as real maps.
function grid(g, W, H, LW, zf, cf, dx, dy, zoff){
  dx = dx||0; dy = dy||0; zoff = zoff||0;
  for (let li = 0; li < NL; li++){
    const y = (li - NL/2) * SPACING, fl = flare[li];
    g.lineWidth = LW; g.lineCap = "round";
    g.strokeStyle = cf(li);
    g.globalAlpha = Math.min(1, 0.78 + Math.min(fl,1.6) * 0.21);   // +50% on the high-note lift
    g.beginPath();
    for (let pi = 0; pi < PTS; pi++){
      const x = (pi - PTS/2) * SPACING;
      const z = zClamp(zf(x, y, li, pi) + rip(x,y) + fl*0.10) + zoff;
      const X = SX(x, z, W) + dx, Y = SY(y, z, H) + dy;
      pi ? g.lineTo(X, Y) : g.moveTo(X, Y);
    }
    g.stroke();
  }
}
// same, but the lines run the other way — for CROSSHATCH
function gridV(g, W, H, LW, zf, cf, dx, dy){
  dx = dx||0; dy = dy||0;
  for (let pi = 0; pi < PTS; pi++){
    const x = (pi - PTS/2) * SPACING;
    g.lineWidth = LW; g.lineCap = "round";
    g.strokeStyle = cf(pi);
    g.globalAlpha = 0.78;
    g.beginPath();
    for (let li = 0; li < NL; li++){
      const y = (li - NL/2) * SPACING;
      const z = zClamp(zf(x, y, li, pi) + rip(x,y) + flare[li]*0.10);
      const X = SX(x, z, W) + dx, Y = SY(y, z, H) + dy;
      li ? g.lineTo(X, Y) : g.moveTo(X, Y);
    }
    g.stroke();
  }
}


// ── HORIZON — LOCKED ──────────────────────────────────────────────────────
// The split is the point: the field reads as one artwork, but the terrain at
// the top belongs to one parent and the terrain at the bottom to the other,
// crossfading through the middle. Colour crossfades with it, so there is no
// seam anywhere — the earlier attempts at a two-parent image looked like two
// artworks sharing a frame, and this does not.
const IDEAS = [
{t:"HORIZON", n:"one field. the top is one parent, the bottom the other, blended through",
 d:function(g,W,H,A,B,LW){
   grid(g,W,H,LW,
     function(x,y,li){ const t=li/(NL-1); return field(A,x,y)*(1-t)+field(B,x,y)*t; },
     function(li){ return mix(col(A,0), col(B,1), li/(NL-1)); }); }},
];

// ── the forged duet, so the audio is the real thing ─────────────────────────
function dur16(d){const dot=d.indexOf(".")>=0,tri=d.indexOf("t")>=0;
 const b={1:16,2:8,4:4,8:2,16:1,32:0.5}[parseInt(d,10)]||2; return b*(dot?1.5:1)*(tri?2/3:1);}
function at16(t){const q=t.split(":");return (+q[0])*16+(+q[1])*4+(+(q[2]||0));}
function move(mel,semis,vel){ return mel.map(function(e){
 return [e[0], toN(toM(e[1])+(semis||0)), e[2], Math.max(0.08,Math.min(1,e[3]*(vel==null?1:vel)))]; }); }
/*  THE DUET — register, not rejection.
 *
 *  The first cut of this FILTERED each parent to its side of the split, which
 *  only worked when the bass parent happened to be written low. Measured on a
 *  real pair: GASP sits 38-74, so filtering below 52 kept 4 of its 44 notes and
 *  the part vanished. OCTANE lost 80 of 120 the same way. Both parents were
 *  being thrown away and it sounded like one piece playing.
 *
 *  So now each parent is MOVED into its register in whole octaves and keeps
 *  every note. The bass part is still reduced to one voice, because a bass line
 *  should be a line, but the treble stays whole.
 */
function medianM(mel, shift){
  const m = mel.map(function(e){ return toM(e[1]) + shift; }).sort(function(a,b){ return a-b; });
  return m.length ? m[m.length >> 1] : SPLIT;
}
function octavesTo(median, target){
  return Math.round((target - median) / 12) * 12;   // whole octaves only, so key survives
}
function duet(bassP,trebP){
  const ks = bassP.transpose - trebP.transpose;

  const bShift0 = bassP.transpose + bassP.octave*12;
  const tShift0 = trebP.transpose + trebP.octave*12 + ks;

  /* sit the bass an octave under the split and the treble an octave over it,
     so the two parts clear each other without either being cut. */
  const bShift = bShift0 + octavesTo(medianM(bassP.melody, bShift0), SPLIT - 12);
  const tShift = tShift0 + octavesTo(medianM(trebP.melody, tShift0), SPLIT + 12);

  let bass = move(bassP.melody, bShift, 1)
    .sort(function(x,y){ return at16(x[0]) - at16(y[0]); });

  /* one voice at a time in the bass — overlapping low notes turn to mud */
  const mono = []; let free = -1;
  for (const e of bass){
    const st = at16(e[0]);
    if (st < free) continue;
    mono.push(e); free = st + dur16(e[2]);
  }

  const treb = move(trebP.melody, tShift, 0.92);
  return mono.concat(treb);
}
// ONE HIT PER BAR, GUARANTEED.
//
// Ranking the whole loop by loudness and taking the top eight looked sensible
// and was badly wrong: bars 2, 3, 6 and 7 of this piece contain only SINGLE
// notes, never two together, so they could never qualify. Every slot went to
// bars 0, 1, 4 and 5 — two bars reacting, two bars dead, twice a loop.
//
// So coverage comes first: take the strongest moment in each bar, preferring
// moments where notes land together but falling back to the loudest single
// note when a bar has nothing else. Every bar gets exactly one hit.


const $=function(id){return document.getElementById(id);};
let urls=null, smp=null, part=null, cpart=null, timer=null, MEL=null, TEMPO_BPM=92;
let lastW=0, lastH=0, frameCount=0;
function lw(){ return LW_CSS * Math.min(2, window.devicePixelRatio||1); }

function build(){
  const out=$("out"); out.innerHTML="";
  const idea=IDEAS[0];
  const c=document.createElement("div"); c.className="cell";
  const cv=document.createElement("canvas");
  c.appendChild(cv); out.appendChild(c);
  idea._cv=cv; idea._g=cv.getContext("2d"); idea._cell=c;
  refreshPieces(); sizeAll(); paint();
}
function refreshPieces(){
  const A=PA, B=PB; if(!A||!B) return;
  MEL = duet(A,B); TEMPO_BPM = B.tempo;
}
function sizeAll(){
  const dpr=Math.min(2, window.devicePixelRatio||1), idea=IDEAS[0];
  const c=idea._cell, cv=idea._cv; if(!c||!cv) return;
  cv.width =Math.floor(Math.max(200,c.clientWidth )*dpr);
  cv.height=Math.floor(Math.max(200,c.clientHeight)*dpr);
}
function paint(){
  frameCount++; FLASH = Math.floor(frameCount/7) % 2;
  const A=PA, B=PB; if(!A||!B) return;
  measureZ(A,B);
  if (!artCv) cardLayout();
  const g = artCv.getContext("2d"), cw = artCv.width, ch = artCv.height;
  g.fillStyle="#05070d"; g.fillRect(0,0,cw,ch);
  fitField(cw, ch);
  IDEAS[0].d(g,cw,ch,A,B,lw());
  g.globalAlpha=1;
  drawCard();
}
function loop(){

  VT+=16; decayFlare(); paint();
  if(Tone.Transport.state==="started"){
    const bar=Math.floor((Tone.Transport.seconds*Tone.Transport.bpm.value/60)/4)%8;
    $("pos").textContent="bar "+(bar+1)+" / 8";
  }
}

async function play(){
  stop();
  await Tone.start();
  if(!window.__built){
    window.__built=1;
    window.__mg=new Tone.Gain(0.66).toDestination();
    const cp=new Tone.Compressor(-12,3).connect(window.__mg);
    const shelf=new Tone.Filter({type:"lowshelf",frequency:200,gain:-5}).connect(cp);
    const sub=new Tone.Filter(40,"highpass").connect(shelf);
    const rv=new Tone.Reverb({decay:6.5,wet:1,preDelay:0.03}).connect(cp);
    const send=new Tone.Filter(300,"highpass").connect(rv);
    const lvl=new Tone.Gain(0.40).connect(send);
    window.__in=new Tone.Filter(6200,"lowpass");
    window.__in.connect(sub); window.__in.connect(lvl);
  }
  smp=new Tone.Sampler({urls:urls,release:2.1}).connect(window.__in);
  const ok=await Promise.race([Tone.loaded().then(function(){return 1;}),
    new Promise(function(r){setTimeout(function(){r(0);},8000);})]);
  if(!ok){ $("diag").innerHTML="<span style='color:#ff6b6b'>audio blocked by this host</span>"; return; }
  Tone.Transport.bpm.value=TEMPO_BPM;
  part=new Tone.Part(function(t,e){
      smp.triggerAttackRelease(e.n,e.d,t,e.v);
      // a plain timer, not Tone.Draw — a hidden tab suspends requestAnimationFrame
      const lead=Math.max(0,(t-Tone.now())*1000);
      setTimeout(function(){
        if (e.m < SPLIT) lowHit(e.v); else highHit(e.m, e.v);
      }, lead);
    },
    MEL.map(function(m){return {time:m[0],n:m[1],d:m[2],v:m[3],m:toM(m[1])};}));
  part.loop=true; part.loopEnd="8m"; part.start(0);
  if(Tone.Transport.state!=="started") Tone.Transport.start();
  const lows=MEL.filter(function(m){return toM(m[1])<SPLIT;}).length;
  $("diag").textContent=lows+" low \u00b7 "+(MEL.length-lows)+" high \u00b7 "+TEMPO_BPM+"bpm";
}
function stop(){
  if(part){try{part.stop();part.dispose();}catch(e){}part=null;}
  if(cpart){try{cpart.stop();cpart.dispose();}catch(e){}cpart=null;}
  if(smp){try{smp.dispose();}catch(e){}smp=null;}
  try{Tone.Transport.stop();}catch(e){}
  ripples.length=0; hiRipples.length=0; flare.fill(0); $("pos").textContent="\u2014";
}




/* ── live engine, ENS and the adapter ────────────────────────────────────
   horizon.html shipped with its two parents hardcoded. This takes any
   address instead: unpack AM125 out of the render bundle, derive both
   pieces on the fly, and rename its fields to the shape the forge below
   already expects. Nothing about the forge or the artwork changes. */
let PA = null, PB = null, AM = null;

const _bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function _gz(u){
  if (u[0] !== 31 || u[1] !== 139) return new TextDecoder().decode(u);
  return await new Response(new Blob([u]).stream()
    .pipeThrough(new DecompressionStream("gzip"))).text();
}
const _run = s => (0, eval)(s);

async function loadEngine(){
  /* Tone is already inlined above and mid-flight, so it is deliberately NOT
     reloaded here — only the pieces the engine itself needs. */
  await new Promise((ok, no) => {
    const t = document.createElement("script");
    t.src = "render/assets.js"; t.onload = ok; t.onerror = no;
    document.head.appendChild(t);
  });
  _run(await _gz(_bin(B.three)));
  _run(await _gz(_bin(B.line2)));
  _run(await _gz(_bin(B.engine)));
  AM = (typeof AM125 !== "undefined") ? AM125 : null;
  if (!AM) throw new Error("engine loaded but AM125 is not defined");
}

/* AM125 names things differently to the forge. Same values, new labels. */
function adapt(p){
  const hex = n => "#" + (n >>> 0).toString(16).padStart(6, "0");
  return {
    tune:      p.motif.name,
    melody:    p.motif.melody,
    chaos:     p.chaos,
    tempo:     p.tempo,
    palette:   p.scheme.name,
    pal:       [hex(p.scheme.color1), hex(p.scheme.color2)],
    wave:      p.waveIdx,
    transpose: p.transposeSemis,
    octave:    p.octaveShift
  };
}

async function resolveENS(name){
  const r = await fetch("https://api.ensideas.com/ens/resolve/" + encodeURIComponent(name));
  const j = await r.json();
  return j && j.address ? j.address.toLowerCase() : null;
}

/* Lowercase always. Casing changes the artwork — see the wiki. */
async function toSeed(raw){
  const t = (raw || "").trim();
  if (!t) return null;
  if (/^0x?[0-9a-fA-F]{40}$/.test(t) || /^0x?[0-9a-fA-F]{64}$/.test(t))
    return (t.startsWith("0x") ? t : "0x" + t).toLowerCase();
  if (t.toLowerCase().endsWith(".eth")) return await resolveENS(t.toLowerCase());
  return null;
}

const randHex = n => "0x" + Array.from({length:n}, () =>
  "0123456789abcdef"[Math.floor(Math.random()*16)]).join("");

async function forge(){
  const wasPlaying = Tone.Transport.state === "started";
  const sa = await toSeed($("a").value), sb = await toSeed($("b").value);
  if (!sa || !sb){ $("diag").textContent = "need two wallets, hashes or .eth names"; return; }
  stop();
  PA = adapt(AM.derive(sa));
  PB = adapt(AM.derive(sb));
  $("title").innerHTML = "<b>" + PA.tune + "</b> × <b>" + PB.tune + "</b>"
    + " &mdash; " + PA.tune + " takes the bass, " + PB.tune + " takes the treble";
  refreshPieces();
  if (wasPlaying) play();
}


/* ── THE CARD ─────────────────────────────────────────────────────────────
   Same furniture as the render card: matte, hairline on the picture, a second
   rule set off from it, then AUDIOMAPS and the two seeds underneath. Sizes are
   taken off the SHORT side, because scaling off width makes every measurement
   half again too big in landscape and the caption then eats the picture. */
const FORMATS = {"1:1":[1080,1080],"4:5":[1080,1350],"9:16":[1080,1920],"16:9":[1920,1080]};
const COLLECTION = "AUDIOMAPS";
const MATTES = {
  paper: { bg:"#efece4", ink:"#16161d", rule:"rgba(22,22,29,0.30)" },
  ink:   { bg:"#0c0c11", ink:"#e8e5dd", rule:"rgba(232,229,221,0.28)" }
};
let LAB = null, cardCtx = null, artCv = null;

/* letter-spacing drawn a glyph at a time — ctx.letterSpacing is Chrome-only
   and losing the tracking on one machine is worse than never having it */
function trackText(ctx, text, x, y, sp){
  let w = 0; for (const ch of text) w += ctx.measureText(ch).width + sp; w -= sp;
  let cx = ctx.textAlign === "center" ? x - w/2 : x;
  const prev = ctx.textAlign; ctx.textAlign = "left";
  for (const ch of text){ ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
  ctx.textAlign = prev;
}

function cardLayout(){
  const [W,H] = FORMATS[$("fmt").value];
  const M = MATTES[$("matte").value];
  const cv = $("cardcv"); cv.width = W; cv.height = H;
  const U = Math.min(W,H), pad = Math.round(U*0.062);
  let aw, ah, cap;
  if (W > H*1.2){
    ah = H - pad*2;
    aw = Math.min(Math.round(ah*1.34), Math.round(W*0.68));
    const gap = Math.round(U*0.058);
    cap = { x: pad+aw+gap, w: W-(pad+aw+gap)-pad, beside:true };
  } else {
    const capH = Math.round(U*0.155);
    aw = W - pad*2;
    ah = H - pad*2 - capH;
    if (ah > aw*1.35) ah = Math.round(aw*1.35);
    cap = { x: pad, w: aw, beside:false };
  }
  LAB = { W,H,M,U,pad,aw,ah,ax:pad,ay:pad,cap };
  if (!artCv) artCv = document.createElement("canvas");
  artCv.width = aw; artCv.height = ah;
  if (!cardCtx) cardCtx = cv.getContext("2d");
}

function drawCard(){
  if (!LAB || !PA || !PB) return;
  const { W,H,M,U,aw,ah,ax,ay,cap } = LAB, g = cardCtx;
  g.fillStyle = M.bg; g.fillRect(0,0,W,H);
  g.drawImage(artCv, ax, ay, aw, ah);

  g.strokeStyle = M.rule; g.lineWidth = 2;
  g.strokeRect(ax+1, ay+1, aw-2, ah-2);
  const o = Math.round(U*0.014);
  g.globalAlpha = 0.45; g.lineWidth = 1;
  g.strokeRect(ax-o, ay-o, aw+o*2, ah+o*2);
  g.globalAlpha = 1;

  const big = Math.round(U*0.040), L2 = Math.round(U*0.045), L3 = Math.round(U*0.077);
  const bx = cap.x;
  const by = cap.beside ? ay + Math.round((ah-L3)/2) + big : ay + ah + Math.round(U*0.052);

  g.fillStyle = M.ink; g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.font = `700 ${big}px ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif`;
  trackText(g, COLLECTION + " DUET", bx, by, big*0.16);

  /* whatever was typed, never swapped for the other form — a half-shown
     wallet is not something anyone can check */
  const fit = (t, px) => { let s2 = px;
    g.font = `500 ${s2}px ui-monospace,Menlo,monospace`;
    while (g.measureText(t).width > cap.w && s2 > 9){ s2--; g.font = `500 ${s2}px ui-monospace,Menlo,monospace`; }
  };
  const seeds = ($("a").value.trim() || "?") + "  ×  " + ($("b").value.trim() || "?");
  g.globalAlpha = 0.8; fit(seeds, Math.round(U*0.0245)); g.fillText(seeds, bx, by+L2);

  const traits = `${PA.tune} × ${PB.tune}   ${TEMPO_BPM} BPM   CHAOS ${PA.chaos}/${PB.chaos}`;
  g.globalAlpha = 0.5; fit(traits, Math.round(U*0.019)); g.fillText(traits, bx, by+L3);
  g.globalAlpha = 1;
}

(function init(){
  const bytes=Uint8Array.from(atob(PIANO_B64),function(c){return c.charCodeAt(0);});
  const dv=new DataView(bytes.buffer), ml=dv.getUint32(0);
  const man=JSON.parse(new TextDecoder().decode(bytes.slice(4,4+ml)));
  urls={};
  const up=function(n){return n.replace(/(-?\d+)$/,function(d){return String(+d+1);});};
  for(const m of man){ if(m[0]==="C7")continue;
    urls[up(m[0])]=URL.createObjectURL(new Blob([bytes.slice(4+ml+m[1],4+ml+m[1]+m[2])],{type:"audio/ogg"})); }
  /* seeded with two of the originals so it opens on something real */
  $("a").value = "0x33fd426905f149f8376e227d0c9d3340aad17af1";
  $("b").value = "ticklesnarf.eth";
  $("go").addEventListener("click", forge);
  ["a","b"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){ if (e.key === "Enter") forge(); });
  });
  ["fmt","matte"].forEach(function(id){
    $(id).addEventListener("change", function(){ cardLayout(); paint(); });
  });
  cardLayout();
  $("rolla").addEventListener("click", function(){ $("a").value = randHex(40); forge(); });
  $("rollb").addEventListener("click", function(){ $("b").value = randHex(40); forge(); });
  $("flashbtn").addEventListener("click", function(){
    FLASH_ON = FLASH_ON ? 0 : 1;
    this.textContent = "flicker: " + (FLASH_ON ? "on" : "off");
  });
  $("playbtn").addEventListener("click", play);
  $("stopbtn").addEventListener("click", stop);
  build();
  timer=setInterval(loop, 55);
  requestAnimationFrame(function(){ setTimeout(sizeAll,0); });
  $("diag").textContent="loading engine\u2026";
  loadEngine().then(function(){
    $("diag").textContent="ready \u00b7 "+Object.keys(urls).length+" samples";
    return forge();
  }).catch(function(e){
    $("diag").textContent="engine failed: " + e.message;
    console.error(e);
  });
})();

/* Optional handoff from forge.html: ?a=<seed>&b=<seed> fills both inputs and
   composes on arrival. With no params this block does nothing at all. */
(function(){
  try {
    const q = new URLSearchParams(location.search);
    const a = q.get("a"), b = q.get("b");
    if (a) $("a").value = a;
    if (b) $("b").value = b;
    if (q.get("embed") !== null){
      /* embed mode: the render and the play button, nothing else */
      var st = document.createElement("style");
      st.textContent = "#hud > *{display:none!important}" +
        "#hud > #playbtn,#hud > #stopbtn,#hud > #pos{display:inline-block!important}" +
        "#title{display:none!important}";
      document.head.appendChild(st);
    }
    if (a && b) setTimeout(function(){ try { forge(); } catch(e){} }, 400);
  } catch(e){}
})();
